# WEAK-w1, arm A — the loop as merged, at the weak-start benchmark's settings.
#
# Only the keys that differ from configs/default.yaml are written here; the
# loader fills every other key from the defaults, and
# tests/test_w1_levers.py::test_the_w1_configs_are_the_brief pins this file's
# diff against the default to the set WEAK-w1.md registers. Every arm of the
# round shares these settings; arms B and V add one key each.
#
# 2026-11-17, after the round: the ruling on its reading moved the default of
# `search.past_par`, and may move `search.value_source`. The arms are what the
# nine runs ran, so every arm now names both keys outright, at its own values,
# and a test pins each file's fingerprint to the one its runs recorded
# (test_the_w1_configs_are_what_the_runs_recorded). "The default" in the
# paragraph above is the default of the day the round was registered: today's
# with `with_m1_search` applied.
train:
  rehearsal_frac: 0.0        # no supervised rows: phase1_train holds BFS labels for the deep problems the weak start must not see
  train_steps_per_iter: 200  # half the campaign's, with its schedule shape (half warmup)
  lr_warmup_steps: 100
  replay_capacity: 60000     # the run fills about a tenth of it; the campaign's 500,000 is 1.3 GiB per saved ring
campaign:
  iterations: 10
  episodes_per_iteration: 200
  intra_op_threads: 3        # nine runs side by side on a 32-vCPU pod (WEAK-w1, amendment of 2026-11-16)
ladder:
  ladder_every: 99           # the campaign's cadence instruments are sized for the Phase-1 anchor; this round reads its own
search:
  past_par: evaluate         # the search M1 ran; the default when this round was registered
  value_source: wdl          # the same
